[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-air-quality-lab"
version = "0.1.0"
description = "A reproducible audit and benchmark of Indian station-level PM2.5 data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
analysis = ["scikit-learn>=1.4"]
test = ["pytest>=8"]

[project.scripts]
aqi-lab = "aqi_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
